# Local development: only the backing services, with ports exposed.
# Run the app itself on the host with `npm run dev`.
#
#   docker compose -f docker-compose.dev.yml up -d

name: white-production-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wp
      POSTGRES_PASSWORD: wp
      POSTGRES_DB: wp
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wp-minio
      MINIO_ROOT_PASSWORD: wp-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2 &&
      mc alias set local http://minio:9000 wp-minio wp-minio-secret &&
      mc mb --ignore-existing local/wp-files
      "

volumes:
  pg_data_dev:
  minio_data_dev:
