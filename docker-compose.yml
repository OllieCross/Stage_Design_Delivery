name: white-production

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wp.rule=Host(`wp.olliecross.com`)"
      - "traefik.http.routers.wp.entrypoints=websecure"
      - "traefik.http.routers.wp.tls.certresolver=letsencrypt"
      - "traefik.http.services.wp.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
    healthcheck:
      # 127.0.0.1, not localhost: alpine resolves "localhost" to ::1 first,
      # and Next's HOSTNAME=0.0.0.0 bind is IPv4-only, so that lookup order
      # always fails the probe with connection refused.
      test: ["CMD-SHELL", "wget -qO- --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot: applies pending Prisma migrations before the app starts.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    command: npx prisma migrate deploy
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      internal:
        # The web container also sits on the shared proxy network, where other
        # stacks publish containers aliased "postgres" / "minio". Address these
        # by a unique alias so a neighbour can never win the DNS lookup.
        aliases:
          - wp-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      internal:
        aliases:
          - wp-minio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket on first start, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://wp-minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET}
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    networks:
      - internal

  # Nightly at 02:30 local time: dumps Postgres to the NAS. Dumps to a temp file
  # and renames it, so a failed dump never overwrites the last good backup.
  postgres-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: >
      sh -c "
        set -o pipefail;
        while true; do
          sleep $$(( ($$(date -d 02:30 +%s) - $$(date +%s) + 86400) % 86400 ));
          if PGPASSWORD=$${POSTGRES_PASSWORD} pg_dump -h wp-postgres -U $${POSTGRES_USER} $${POSTGRES_DB} | gzip > /backups/postgres.sql.gz.tmp; then
            mv /backups/postgres.sql.gz.tmp /backups/postgres.sql.gz;
          else
            rm -f /backups/postgres.sql.gz.tmp;
          fi;
          sleep 60;
        done
      "
    volumes:
      - type: volume
        source: nas_backups
        target: /backups
        volume:
          nocopy: true
      - /etc/localtime:/etc/localtime:ro
    # The image declares a data VOLUME; tmpfs stops an anonymous volume piling
    # up on every recreate.
    tmpfs:
      - /var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # Nightly at 02:30 local time: archives the MinIO volume to the NAS.
  minio-backup:
    image: offen/docker-volume-backup:v2
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "30 2 * * *"
      BACKUP_FILENAME: "minio-backup.tar.gz"
    volumes:
      - minio_data:/backup/minio_data:ro
      - type: volume
        source: nas_backups
        target: /archive
        volume:
          nocopy: true
      - /etc/localtime:/etc/localtime:ro
    networks:
      - internal

volumes:
  pg_data:
  minio_data:
  # Synology NAS share; each nightly backup overwrites the previous one. The
  # share's NFS rule needs squash "Map all users to admin": the Docker daemon
  # uses userns-remap, so container root reaches the NAS as an unknown uid.
  nas_backups:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.0.22,nfsvers=4,rw,soft
      device: ":/volume3/Homelab_Backups/white-production"

networks:
  internal:
  proxy:
    external: true
